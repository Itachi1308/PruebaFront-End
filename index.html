<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargo Orders</title>
  <!-- Open Sans como fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ========== RESET Y VARIABLES ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2a5fc1;
      --primary-light: #e5edff;
      --bg: #f5f7fc;
      --card-bg: #ffffff;
      --border-radius: 16px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --text-dark: #1a1a2e;
      --text-muted: #6b7a8f;
      --text-light: #a0aec0;
      --status-in-transit: #2a5fc1;
      --status-assigned: #d69e2e;
      --status-completed: #38a169;
      --status-past: #718096;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      max-width: 1280px;
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 30px 35px;
      box-shadow: var(--shadow);
    }

    /* ========== HEADER ========== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 20px;
      gap: 15px;
    }

    .header h1 {
      font-weight: 700;
      font-size: 28px;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .header h1 i {
      color: var(--primary);
      margin-right: 12px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #f0f2f7;
      border-radius: 30px;
      padding: 0 16px;
      height: 42px;
    }

    .search-box i {
      color: var(--text-muted);
      margin-right: 10px;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      font-family: 'Open Sans', sans-serif;
      color: var(--text-dark);
      width: 180px;
    }

    .search-box input::placeholder {
      color: var(--text-light);
    }

    .refresh-btn {
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Open Sans', sans-serif;
      white-space: nowrap;
    }

    .refresh-btn:hover {
      background: #1f4a9e;
      transform: scale(1.02);
    }

    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ========== TABS ========== */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 2px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
      position: relative;
      font-family: 'Open Sans', sans-serif;
      border-radius: 30px 30px 0 0;
    }

    .tab-btn:hover {
      color: var(--text-dark);
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px 3px 0 0;
    }

    .tab-btn .badge {
      background: #edf2f7;
      color: var(--text-muted);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-left: 8px;
      font-weight: 700;
    }

    .tab-btn.active .badge {
      background: var(--primary);
      color: white;
    }

    /* ========== CONTADOR ========== */
    .results-counter {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-weight: 400;
    }
    .results-counter span {
      font-weight: 700;
      color: var(--text-dark);
    }

    /* ========== GRID DE TARJETAS ========== */
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 25px;
      margin-top: 10px;
    }

    /* ========== TARJETA DE PEDIDO ========== */
    .order-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 22px 22px 25px;
      box-shadow: var(--shadow);
      border: 1px solid #edf2f7;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .order-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(42, 95, 193, 0.08);
      border-color: #d0d9e8;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .order-number {
      font-weight: 700;
      font-size: 18px;
      color: var(--text-dark);
    }

    .order-type {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .order-status {
      font-size: 14px;
      font-weight: 600;
      padding: 4px 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .order-status .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .status-in-transit .dot { background: var(--status-in-transit); }
    .status-in-transit { color: var(--status-in-transit); }

    .status-assigned .dot { background: var(--status-assigned); }
    .status-assigned { color: var(--status-assigned); }

    .status-completed .dot { background: var(--status-completed); }
    .status-completed { color: var(--status-completed); }

    .status-past .dot { background: var(--status-past); }
    .status-past { color: var(--status-past); }

    /* Pickup & Dropoff */
    .location-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 10px 0 14px;
      font-size: 14px;
    }

    .location-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .location-item .icon {
      width: 20px;
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 2px;
    }

    .location-item .label {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .location-item .address {
      font-weight: 600;
      color: var(--text-dark);
      line-height: 1.4;
    }

    .location-item .datetime {
      color: var(--text-muted);
      font-size: 13px;
      display: flex;
      gap: 12px;
      margin-top: 2px;
    }

    .location-item .datetime span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Resume y botón Navegar */
    .order-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #edf2f7;
    }

    .order-resume {
      font-weight: 600;
      color: var(--primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }

    .order-resume:hover {
      color: #1f4a9e;
      text-decoration: underline;
    }

    .nav-btn {
      background: #edf2f7;
      border: none;
      padding: 6px 18px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      cursor: not-allowed;
      transition: 0.2s;
      font-family: 'Open Sans', sans-serif;
      opacity: 0.6;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      opacity: 1;
      cursor: pointer;
    }

    .nav-btn.active:hover {
      background: #1f4a9e;
      transform: scale(1.02);
    }

    /* ========== MODAL DE DETALLE ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 35px 40px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
      position: relative;
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: #edf2f7;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: #d0d9e8;
      color: var(--text-dark);
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .modal-ref {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    /* Switch Pickup / Dropoff */
    .switch-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #f0f2f7;
      padding: 6px;
      border-radius: 30px;
      width: fit-content;
    }

    .switch-btn {
      background: transparent;
      border: none;
      padding: 8px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Open Sans', sans-serif;
    }

    .switch-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .switch-btn:hover:not(.active) {
      color: var(--text-dark);
    }

    .detail-destination {
      background: #f7fafc;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .detail-destination .main {
      font-weight: 700;
      font-size: 16px;
    }

    .detail-destination .sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .detail-destination .extra {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 30px;
      margin-top: 10px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .detail-destination .extra i {
      width: 18px;
      color: var(--text-light);
    }

    /* Timeline */
    .detail-timeline {
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
    }

    .detail-timeline li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f2f7;
      font-size: 14px;
    }

    .detail-timeline li:last-child {
      border-bottom: 0;
    }

    .detail-timeline li .check {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .detail-timeline li .check.done {
      color: var(--status-completed);
    }

    .detail-timeline li .check.pending {
      color: var(--text-light);
    }

    .detail-timeline li .text {
      flex: 1;
    }

    .detail-timeline li .time {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Track Order button */
    .track-btn {
      background: #edf2f7;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-muted);
      cursor: not-allowed;
      transition: 0.2s;
      font-family: 'Open Sans', sans-serif;
      opacity: 0.5;
      margin-top: 10px;
    }

    .track-btn.active {
      background: var(--primary);
      color: white;
      opacity: 1;
      cursor: pointer;
    }

    .track-btn.active:hover {
      background: #1f4a9e;
      transform: scale(1.02);
    }

    /* Panel expandible */
    .expandable-panel {
      margin-top: 20px;
      border-top: 1px solid #edf2f7;
      padding-top: 16px;
    }

    .expandable-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
      color: var(--primary);
    }

    .expandable-header i {
      transition: transform 0.3s;
    }

    .expandable-header.open i {
      transform: rotate(180deg);
    }

    .expandable-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }

    .expandable-body.open {
      max-height: 500px; /* suficiente para el contenido */
    }

    .expandable-body .content {
      padding-top: 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ========== ESTADOS ========== */
    .loading-spinner,
    .error-state,
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .loading-spinner .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #edf2f7;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-state i {
      font-size: 48px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .error-state button {
      margin-top: 20px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 30px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Open Sans', sans-serif;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .app {
        padding: 20px 16px;
      }
      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
      }
      .header h1 {
        font-size: 22px;
      }
      .header-actions {
        justify-content: stretch;
      }
      .search-box input {
        width: 100%;
      }
      .tabs {
        overflow-x: auto;
        flex-wrap: nowrap;
        gap: 4px;
      }
      .tab-btn {
        padding: 10px 16px;
        font-size: 14px;
        white-space: nowrap;
      }
      .orders-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .modal-content {
        padding: 24px 20px;
      }
      .switch-container {
        width: 100%;
        justify-content: center;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .orders-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

<div class="app" id="app">
  <!-- HEADER -->
  <header class="header">
    <h1><i class="fas fa-truck"></i> Cargo Orders</h1>
    <div class="header-actions">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Filtrar por número..." />
      </div>
      <button class="refresh-btn" id="refreshBtn">
        <i class="fas fa-sync-alt"></i> Actualizar
      </button>
    </div>
  </header>

  <!-- TABS -->
  <div class="tabs" id="tabsContainer">
    <button class="tab-btn active" data-tab="upcoming">
      <i class="fas fa-clock"></i> Upcoming
      <span class="badge" id="upcomingCount">0</span>
    </button>
    <button class="tab-btn" data-tab="completed">
      <i class="fas fa-check-circle"></i> Completed
      <span class="badge" id="completedCount">0</span>
    </button>
    <button class="tab-btn" data-tab="past">
      <i class="fas fa-history"></i> Past
      <span class="badge" id="pastCount">0</span>
    </button>
  </div>

  <!-- CONTADOR -->
  <div class="results-counter">
    Mostrando <span id="showingCount">0</span> pedidos
  </div>

  <!-- GRID -->
  <div class="orders-grid" id="ordersGrid">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <span>Cargando pedidos...</span>
    </div>
  </div>
</div>

<!-- ===== MODAL DE DETALLE ===== -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-content" id="modalContent">
    <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  // ================================================================
  // 1. CONFIGURACIÓN DE LA API
  // ================================================================
  const API_BASE = 'https://129bc152-6319-4e38-b755-534a4ee46195.mock.pstmn.io';
  const ENDPOINTS = {
    upcoming: `${API_BASE}/orders/upcoming`,
    all: `${API_BASE}/orders`
  };

  // ================================================================
  // 2. ESTADO GLOBAL
  // ================================================================
  let allOrders = [];
  let filteredOrders = [];
  let currentTab = 'upcoming';
  let searchTerm = '';
  let isLoading = false;

  // ================================================================
  // 3. DOM REFS
  // ================================================================
  const grid = document.getElementById('ordersGrid');
  const tabs = document.querySelectorAll('.tab-btn');
  const refreshBtn = document.getElementById('refreshBtn');
  const searchInput = document.getElementById('searchInput');
  const upcomingCount = document.getElementById('upcomingCount');
  const completedCount = document.getElementById('completedCount');
  const pastCount = document.getElementById('pastCount');
  const showingCount = document.getElementById('showingCount');
  const modalOverlay = document.getElementById('detailModal');
  const modalBody = document.getElementById('modalBody');
  const modalClose = document.getElementById('modalClose');

  // ================================================================
  // 4. FUNCIONES AUXILIARES
  // ================================================================
  function getStatusClass(status) {
    const map = {
      'in-transit': 'status-in-transit',
      'assigned': 'status-assigned',
      'completed': 'status-completed',
      'past': 'status-past'
    };
    return map[status?.toLowerCase()] || 'status-in-transit';
  }

  function getStatusLabel(status) {
    const map = {
      'in-transit': 'In transit',
      'assigned': 'Assigned',
      'completed': 'Completed',
      'past': 'Past'
    };
    return map[status?.toLowerCase()] || status || 'Unknown';
  }

  function getInitials(name) {
    if (!name) return '?';
    const parts = name.trim().split(' ');
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  // ================================================================
  // 5. RENDERIZADO DE TARJETAS (con botón Navegar y resumen clickeable)
  // ================================================================
  function createOrderCard(order) {
    const card = document.createElement('div');
    card.className = 'order-card';
    card.dataset.id = order.id;

    // --- Header ---
    const header = document.createElement('div');
    header.className = 'order-header';
    header.innerHTML = `
      <span class="order-number">Order #${order.id || 'N/A'}</span>
      <span class="order-type">${order.type || 'FCL'}</span>
    `;
    card.appendChild(header);

    // --- Status ---
    const status = order.status || 'in-transit';
    const statusDiv = document.createElement('div');
    statusDiv.className = `order-status ${getStatusClass(status)}`;
    statusDiv.innerHTML = `<span class="dot"></span> ${getStatusLabel(status)}`;
    card.appendChild(statusDiv);

    // --- Location (pickup/dropoff) ---
    const locationBlock = document.createElement('div');
    locationBlock.className = 'location-block';

    // Asumimos que los datos vienen en un array "destinations" (según las imágenes)
    // o usamos pickup/dropoff si existen.
    const destinations = order.destinations || [];
    let pickup = destinations.find(d => d.type === 'pickup') || order.pickup || {};
    let dropoff = destinations.find(d => d.type === 'dropoff') || order.dropoff || {};

    // Pickup
    const pickupItem = document.createElement('div');
    pickupItem.className = 'location-item';
    pickupItem.innerHTML = `
      <div class="icon"><i class="fas fa-arrow-up"></i></div>
      <div>
        <div class="label">PICKUP</div>
        <div class="address">${pickup.city || ''}</div>
        <div style="color: var(--text-muted); font-size:13px;">${pickup.address || ''}</div>
        <div class="datetime">
          <span><i class="far fa-calendar-alt"></i> ${pickup.date || ''}</span>
          <span><i class="far fa-clock"></i> ${pickup.time || ''}</span>
        </div>
      </div>
    `;
    locationBlock.appendChild(pickupItem);

    // Dropoff
    const dropoffItem = document.createElement('div');
    dropoffItem.className = 'location-item';
    dropoffItem.innerHTML = `
      <div class="icon"><i class="fas fa-arrow-down"></i></div>
      <div>
        <div class="label">DROPOFF</div>
        <div class="address">${dropoff.city || ''}</div>
        <div style="color: var(--text-muted); font-size:13px;">${dropoff.address || ''}</div>
        <div class="datetime">
          <span><i class="far fa-calendar-alt"></i> ${dropoff.date || ''}</span>
          <span><i class="far fa-clock"></i> ${dropoff.time || ''}</span>
        </div>
      </div>
    `;
    locationBlock.appendChild(dropoffItem);

    card.appendChild(locationBlock);

    // --- Actions: Resumen (clickeable) + Botón Navegar ---
    const actions = document.createElement('div');
    actions.className = 'order-actions';

    const resume = document.createElement('div');
    resume.className = 'order-resume';
    resume.innerHTML = `<i class="fas fa-info-circle"></i> ${order.resume || 'Ver detalles'}`;
    // Al hacer clic en el resumen, abre el modal con los detalles de la orden
    resume.addEventListener('click', (e) => {
      e.stopPropagation();
      openDetail(order);
    });
    actions.appendChild(resume);

    // Botón Navegar
    const navBtn = document.createElement('button');
    navBtn.className = 'nav-btn';
    navBtn.textContent = 'Navegar';
    // Verificar si ya pasó la fecha de inicio (start_date)
    const startDate = order.start_date ? new Date(order.start_date) : null;
    const now = new Date();
    if (startDate && now >= startDate) {
      navBtn.classList.add('active');
      navBtn.disabled = false;
    } else {
      navBtn.disabled = true;
    }
    navBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (navBtn.classList.contains('active')) {
        console.log('Navegar');
      }
    });
    actions.appendChild(navBtn);

    card.appendChild(actions);

    return card;
  }

  function renderOrders(orders) {
    grid.innerHTML = '';
    if (!orders || orders.length === 0) {
      grid.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i> No hay pedidos para mostrar</div>`;
      showingCount.textContent = '0';
      return;
    }
    showingCount.textContent = orders.length;
    orders.forEach(order => {
      grid.appendChild(createOrderCard(order));
    });
  }

  // ================================================================
  // 6. MODAL DE DETALLE (con switch, timeline, track button, panel expandible)
  // ================================================================
  let currentDetailOrder = null;
  let currentDestinationIndex = 0; // 0 = pickup, 1 = dropoff

  function renderDetail(order) {
    currentDetailOrder = order;
    const destinations = order.destinations || [];
    // Si no hay destinations, usamos pickup/dropoff como antes
    let pickup = destinations.find(d => d.type === 'pickup') || order.pickup || {};
    let dropoff = destinations.find(d => d.type === 'dropoff') || order.dropoff || {};
    // Si no hay destinations pero hay pickup/dropoff separados, los unimos
    if (destinations.length === 0 && (order.pickup || order.dropoff)) {
      destinations.push({ type: 'pickup', ...order.pickup });
      destinations.push({ type: 'dropoff', ...order.dropoff });
      pickup = destinations[0];
      dropoff = destinations[1];
    }

    // Asegurar que haya al menos dos destinos (si no, duplicar)
    if (destinations.length === 0) {
      destinations.push({ type: 'pickup', city: 'N/A', address: 'N/A', date: '', time: '' });
      destinations.push({ type: 'dropoff', city: 'N/A', address: 'N/A', date: '', time: '' });
      pickup = destinations[0];
      dropoff = destinations[1];
    }

    // Estado numérico para el botón Track Order (statusNumber)
    const statusNumber = order.statusNumber || order.status_code || 0;

    // Timeline (steps)
    const steps = order.steps || [
      { text: 'Created Order', completed: true, time: '10:30 PM' },
      { text: 'Accepted Order', completed: true, time: '10:30 PM' },
      { text: 'Pickup set up by William', completed: false, time: '10:30 PM' },
      { text: 'Pickup Completed', completed: false, time: '10:30 PM' }
    ];

    // Contacto (puede venir en order.contact)
    const contact = order.contact || {
      address: pickup.address || 'Dirección no disponible',
      phone: '+52 55 1234 5678',
      email: 'contacto@cargo.com'
    };

    // Construir el HTML del modal
    modalBody.innerHTML = `
      <div class="modal-title">${order.id || 'Pedido'}</div>
      <div class="modal-ref">Referencia ${order.reference || 'N/A'} · Order #${order.id || ''}</div>

      <!-- Switch Pickup / Dropoff -->
      <div class="switch-container" id="switchContainer">
        <button class="switch-btn active" data-index="0">Pickup</button>
        <button class="switch-btn" data-index="1">Dropoff</button>
      </div>

      <!-- Detalle del destino seleccionado -->
      <div id="destinationDetail">
        ${renderDestination(destinations, 0)}
      </div>

      <!-- Timeline -->
      <div style="margin-top:24px;">
        <h3 style="font-size:16px; font-weight:700; margin-bottom:12px;"><i class="fas fa-list-ul" style="color:var(--primary);"></i> Timeline</h3>
        <ul class="detail-timeline">
          ${steps.map(step => `
            <li>
              <span class="check ${step.completed ? 'done' : 'pending'}">
                <i class="fas ${step.completed ? 'fa-check-circle' : 'fa-circle'}"></i>
              </span>
              <span class="text">${step.text}</span>
              <span class="time">${step.time || ''}</span>
            </li>
          `).join('')}
        </ul>
      </div>

      <!-- Track Order Button -->
      <button class="track-btn ${statusNumber >= 3 ? 'active' : ''}" id="trackBtn">
        <i class="fas fa-satellite-dish"></i> Track Order
      </button>

      <!-- Panel expandible -->
      <div class="expandable-panel">
        <div class="expandable-header" id="expandableHeader">
          <span><i class="fas fa-chevron-down"></i> Información adicional</span>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="expandable-body" id="expandableBody">
          <div class="content">
            <p><strong>Contacto:</strong></p>
            <p><i class="fas fa-map-marker-alt"></i> ${contact.address}</p>
            <p><i class="fas fa-phone"></i> ${contact.phone}</p>
            <p><i class="fas fa-envelope"></i> ${contact.email}</p>
            <p style="margin-top:10px;"><strong>Notas:</strong> ${order.notes || 'Sin notas adicionales.'}</p>
          </div>
        </div>
      </div>
    `;

    // --- Lógica del switch ---
    const switchBtns = modalBody.querySelectorAll('.switch-btn');
    switchBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        switchBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const index = parseInt(this.dataset.index);
        const destDetail = document.getElementById('destinationDetail');
        destDetail.innerHTML = renderDestination(destinations, index);
      });
    });

    // --- Lógica del botón Track Order ---
    const trackBtn = document.getElementById('trackBtn');
    if (trackBtn) {
      trackBtn.addEventListener('click', function() {
        if (this.classList.contains('active')) {
          console.log('Track Order');
        }
      });
    }

    // --- Lógica del panel expandible ---
    const expandableHeader = document.getElementById('expandableHeader');
    const expandableBody = document.getElementById('expandableBody');
    if (expandableHeader) {
      expandableHeader.addEventListener('click', function() {
        this.classList.toggle('open');
        expandableBody.classList.toggle('open');
      });
    }

    // Inicialmente el panel está cerrado
    if (expandableBody) expandableBody.classList.remove('open');
    if (expandableHeader) expandableHeader.classList.remove('open');
  }

  function renderDestination(destinations, index) {
    const dest = destinations[index] || {};
    const label = index === 0 ? 'PICKUP' : 'DROPOFF';
    const icon = index === 0 ? 'fa-arrow-up' : 'fa-arrow-down';
    return `
      <div class="detail-destination">
        <div class="main"><i class="fas ${icon}" style="color:var(--primary);"></i> ${label}</div>
        <div class="sub">${dest.address || 'Dirección no disponible'}</div>
        <div class="extra">
          <span><i class="far fa-calendar-alt"></i> ${dest.date || ''}</span>
          <span><i class="far fa-clock"></i> ${dest.time || ''}</span>
          <span><i class="fas fa-city"></i> ${dest.city || ''}</span>
        </div>
      </div>
    `;
  }

  function openDetail(order) {
    // Guardar la orden actual y renderizar
    renderDetail(order);
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  // Eventos del modal
  modalClose.addEventListener('click', closeDetail);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeDetail();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDetail();
  });

  // ================================================================
  // 7. CARGA DE DATOS DESDE LA API (sin mock)
  // ================================================================
  async function fetchOrders() {
    if (isLoading) return;
    isLoading = true;
    refreshBtn.disabled = true;
    refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';

    grid.innerHTML = `
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span>Obteniendo datos del servidor...</span>
      </div>
    `;

    try {
      const [upcomingRes, allRes] = await Promise.all([
        fetch(ENDPOINTS.upcoming),
        fetch(ENDPOINTS.all)
      ]);

      if (!upcomingRes.ok || !allRes.ok) {
        throw new Error(`Error en la API (${upcomingRes.status} / ${allRes.status})`);
      }

      const upcomingData = await upcomingRes.json();
      const allData = await allRes.json();

      const upcoming = Array.isArray(upcomingData) ? upcomingData : (upcomingData.data || []);
      const all = Array.isArray(allData) ? allData : (allData.data || []);

      const combined = [...upcoming, ...all];
      const unique = combined.filter((item, index, self) =>
        index === self.findIndex(o => o.id === item.id)
      );

      // Mapeo a la estructura esperada por la interfaz
      allOrders = unique.map(order => ({
        id: order.id || order.orderId || 'N/A',
        reference: order.reference || '',
        type: order.type || 'FCL',
        status: order.status || order.state || 'in-transit',
        // Para el botón Navegar: start_date
        start_date: order.start_date || order.pickup?.date || null,
        // Destinations: si la API los devuelve, usarlos; si no, construir desde pickup/dropoff
        destinations: order.destinations || (order.pickup || order.dropoff ? [
          { type: 'pickup', ...(order.pickup || {}) },
          { type: 'dropoff', ...(order.dropoff || {}) }
        ] : []),
        // Para el resumen
        resume: order.resume || 'Ver detalles',
        // Para el timeline
        steps: order.steps || [
          { text: 'Created Order', completed: true, time: '10:30 PM' },
          { text: 'Accepted Order', completed: true, time: '10:30 PM' },
          { text: 'Pickup set up by William', completed: false, time: '10:30 PM' },
          { text: 'Pickup Completed', completed: false, time: '10:30 PM' }
        ],
        // Para el botón Track Order
        statusNumber: order.statusNumber || order.status_code || 0,
        // Contacto
        contact: order.contact || {
          address: order.pickup?.address || 'Dirección no disponible',
          phone: '+52 55 1234 5678',
          email: 'contacto@cargo.com'
        },
        notes: order.notes || 'Sin notas adicionales.',
        // Guardar también los datos originales por si se necesitan
        _raw: order
      }));

      // Actualizar contadores
      const upcomingOrders = allOrders.filter(o =>
        ['in-transit', 'assigned', 'upcoming'].includes(o.status?.toLowerCase())
      );
      const completedOrders = allOrders.filter(o =>
        o.status?.toLowerCase() === 'completed'
      );
      const pastOrders = allOrders.filter(o =>
        ['past', 'expired', 'done'].includes(o.status?.toLowerCase())
      );

      upcomingCount.textContent = upcomingOrders.length;
      completedCount.textContent = completedOrders.length;
      pastCount.textContent = pastOrders.length;

      applyFilters();

    } catch (error) {
      console.error('Error al cargar pedidos:', error);
      grid.innerHTML = `
        <div class="error-state">
          <i class="fas fa-exclamation-circle"></i>
          <h3>Error al cargar los pedidos</h3>
          <p>${error.message}</p>
          <button onclick="fetchOrders()">Reintentar</button>
        </div>
      `;
      showingCount.textContent = '0';
    } finally {
      isLoading = false;
      refreshBtn.disabled = false;
      refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Actualizar';
    }
  }

  // ================================================================
  // 8. FILTRADO POR PESTAÑA Y BÚSQUEDA
  // ================================================================
  function applyFilters() {
    let filtered = allOrders;

    // Filtro por tab
    if (currentTab === 'upcoming') {
      filtered = filtered.filter(o =>
        ['in-transit', 'assigned', 'upcoming'].includes(o.status?.toLowerCase())
      );
    } else if (currentTab === 'completed') {
      filtered = filtered.filter(o =>
        o.status?.toLowerCase() === 'completed'
      );
    } else if (currentTab === 'past') {
      filtered = filtered.filter(o =>
        ['past', 'expired', 'done'].includes(o.status?.toLowerCase())
      );
    }

    // Filtro por búsqueda (número de orden)
    if (searchTerm.trim() !== '') {
      const term = searchTerm.trim().toLowerCase();
      filtered = filtered.filter(o =>
        o.id?.toLowerCase().includes(term)
      );
    }

    filteredOrders = filtered;
    renderOrders(filteredOrders);
  }

  // ================================================================
  // 9. MANEJO DE TABS Y BÚSQUEDA
  // ================================================================
  function setupTabs() {
    tabs.forEach(tab => {
      tab.addEventListener('click', function() {
        tabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentTab = this.dataset.tab;
        applyFilters();
      });
    });
  }

  // ================================================================
  // 10. INICIALIZACIÓN
  // ================================================================
  function init() {
    setupTabs();
    fetchOrders();
    refreshBtn.addEventListener('click', fetchOrders);
    searchInput.addEventListener('input', function() {
      searchTerm = this.value;
      applyFilters();
    });
  }

  // Exponer fetchOrders globalmente para el botón de reintento
  window.fetchOrders = fetchOrders;

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
